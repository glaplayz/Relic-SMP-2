name: ImposterPlugin
version: '1.1.0'
main: com.imposter.ImposterPlugin
api-version: '1.21'
author: Claude
description: A 10-vs-1 secret Imposter/Crewmate minigame plugin inspired by "10 YouTubers vs 1 Secret Liar"

commands:
  imposter:
    description: Main command to control the Imposter game
    usage: /imposter <start [imposters]|stop|join|leave|status|give-task-item|give-weapon>
    aliases: [imp, liar]
  startimposter:
    description: Quick-start command - starts the game with the current lobby
    usage: /startimposter [numberOfImposters]
    aliases: [startliar, startgame]

permissions:
  imposter.admin:
    description: Allows starting/stopping/configuring games
    default: op
  imposter.play:
    description: Allows joining games
    default: true
